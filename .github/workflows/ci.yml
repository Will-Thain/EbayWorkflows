name: CI

on:
  push:
    branches:
      - main
      - "milestone-*"
      - "feature/*"
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install \
            alembic faiss-cpu httpx numpy opencv-python-headless psycopg[binary] \
            pydantic pydantic-settings pytest rapidfuzz rich ruff sqlalchemy structlog \
            tenacity typer
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install open-clip-torch

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Ruff
        run: ruff check .

      - name: Compile source
        run: python -m compileall src

      - name: Pytest
        run: pytest -q
