name: CI

on:
  push:
    branches:
      - main
      - "milestone-*"
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pytest ruff sqlalchemy rapidfuzz

      - name: Ruff
        run: ruff check .

      - name: Compile source
        run: python -m compileall src

      - name: Pytest
        run: pytest -q
